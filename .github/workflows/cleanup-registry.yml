name: Delete streaming service images

on:
  repository_dispatch:
    types:
      - cleanup-registry

run-name: "Cleanup registry - ${{ github.event.client_payload.service }}"

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Delete all streaming service images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          KEEP_COUNT=30
          PROTECTED_TAGS="uat prod dev"

          echo "=== Getting streaming/service versions ==="

          gh api \
            --paginate \
            --jq \
            --arg keep "$KEEP_COUNT" \
            --arg protected "$PROTECTED_TAGS" \
            '
              sort_by(.created_at)
              | reverse
              | [
                  .[]
                  | select(
                      any(
                        (.metadata.container.tags // [])[];
                        ($protected | split(" ")) | index(.)
                      ) | not
                    )
                ]
              | .[$keep | tonumber:]
              | .[].id
            ' \
            "/user/packages/container/tic-tac-toe-streaming%2Fservice/versions?per_page=100" |
          while read -r VERSION_ID; do
            echo "Deleting version: $VERSION_ID"

            gh api \
              --method DELETE \
              "/user/packages/container/tic-tac-toe-streaming%2Fservice/versions/$VERSION_ID"
          done

          echo "=== Cleanup completed ==="