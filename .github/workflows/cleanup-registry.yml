name: Cleanup streaming registry

on:
  repository_dispatch:
    types:
      - cleanup-registry

run-name: "Cleanup registry - ${{ github.event.client_payload.service }}"

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Cleanup streaming service and predeploy images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          KEEP_COUNT=30
          PROTECTED_TAGS="uat prod dev"

          for TYPE in service predeploy; do
            echo "=== Cleanup $TYPE ==="

            gh api \
              --paginate \
              "/user/packages/container/tic-tac-toe-streaming%2F${TYPE}/versions?per_page=100" |
            jq -r \
              --argjson keep "$KEEP_COUNT" \
              --arg protected "$PROTECTED_TAGS" '
                ($protected | split(" ")) as $protected_tags
                |
                sort_by(.created_at)
                | reverse
                |
                [
                  .[]
                  | select(
                      any(
                        (.metadata.container.tags // [])[];
                        ($protected_tags | index(.)) != null
                      ) | not
                    )
                ]
                | .[$keep:]
                | .[].id
              ' |
            while read -r VERSION_ID; do
              [ -z "$VERSION_ID" ] && continue

              echo "Deleting $TYPE version: $VERSION_ID"

              gh api \
                --method DELETE \
                "/user/packages/container/tic-tac-toe-streaming%2F${TYPE}/versions/$VERSION_ID"
            done
          done

          echo "=== Cleanup completed ==="