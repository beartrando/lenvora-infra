name: Cleanup registry

on:
  repository_dispatch:
    types:
      - cleanup-registry

run-name: "Cleanup registry - ${{ github.event.client_payload.service }}"

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Cleanup registry
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          set -e

          REPO_NAME="${REPO#*/}"
          KEEP_COUNT=3
          PROTECTED_TAGS="dev uat prod"

          echo "=== Cleanup registry ==="
          echo "Repository: $REPO"
          echo "Package: $REPO_NAME"
          echo "Keep: $KEEP_COUNT"
          echo "Protected tags: $PROTECTED_TAGS"

          for TYPE in service predeploy; do
            echo "=== Cleanup $TYPE ==="

            gh api \
              --paginate \
              "/user/packages/container/${REPO_NAME}%2F${TYPE}/versions?per_page=100" |
            jq -r \
              --argjson keep "$KEEP_COUNT" \
              --arg protected "$PROTECTED_TAGS" '
                ($protected | split(" ")) as $protected_tags
                |
                sort_by(.created_at)
                | reverse
                | [
                    .[]
                    | select(
                        any(
                          (.metadata.container.tags // [])[];
                          . as $tag
                          | ($protected_tags | index($tag)) != null
                        ) | not
                      )
                  ]
                | .[$keep:]
                | .[].id
              ' |
            while read -r VERSION_ID; do
              [ -z "$VERSION_ID" ] && continue

              echo "Deleting $TYPE version: $VERSION_ID"

              gh api \
                --method DELETE \
                "/user/packages/container/${REPO_NAME}%2F${TYPE}/versions/$VERSION_ID"
            done
          done

          echo "=== Cleanup completed ==="