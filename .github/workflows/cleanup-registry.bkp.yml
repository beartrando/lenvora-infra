name: Cleanup registry

on:
  repository_dispatch:
    types:
      - cleanup-registry-bkp

run-name: "Cleanup registry - ${{ github.event.client_payload.service }}"

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Cleanup old container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          set -e
          set -o pipefail

          SERVICE_PACKAGE="${REPO}/service"
          PREDEPLOY_PACKAGE="${REPO}/predeploy"

          echo "=== Registry cleanup ==="
          echo "Service package: $SERVICE_PACKAGE"
          echo "Predeploy package: $PREDEPLOY_PACKAGE"

          for PACKAGE in "$SERVICE_PACKAGE" "$PREDEPLOY_PACKAGE"; do
            ENCODED_PACKAGE="${PACKAGE/\//%2F}"

            echo "=== Cleanup: $PACKAGE ==="

            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE/versions?per_page=100" \
              --jq '.[].id' |
            tail -n +31 |
            while read -r VERSION_ID; do
              echo "Deleting version: $VERSION_ID"

              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE/versions/$VERSION_ID"
            done
          done

          echo "=== Cleanup completed ==="