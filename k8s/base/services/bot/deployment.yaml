apiVersion: apps/v1
kind: Deployment
metadata:
  name: remy
spec:
  replicas: 1

  selector:
    matchLabels:
      app: remy

  template:
    metadata:
      labels:
        app: remy

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: remy
          image: ghcr.io/beartrando/lenvora-remy/service

          ports:
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: remy-env
            - secretRef:
                name: remy-env

          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
