apiVersion: apps/v1
kind: Deployment
metadata:
  name: gusteau
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gusteau

  template:
    metadata:
      labels:
        app: gusteau

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: gusteau
          image: ghcr.io/beartrando/lenvora-gusteau/service

          ports:
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: gusteau-env
            - secretRef:
                name: gusteau-env

          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
